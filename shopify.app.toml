# Shopify CLI app configuration (shopify app deploy). Fill client_id after creating the app in the Partner Dashboard.
name = "W System E-Invoice"
client_id = "REPLACE_WITH_CLIENT_ID"
application_url = "https://REPLACE.workers.dev/app"
embedded = true

[access_scopes]
scopes = "read_orders,write_orders"
use_legacy_install_flow = false

[auth]
redirect_urls = ["https://REPLACE.workers.dev/auth/callback"]

[webhooks]
api_version = "2026-07"

  [[webhooks.subscriptions]]
  topics = ["orders/create"]
  uri = "/webhooks/orders-create"

  [[webhooks.subscriptions]]
  topics = ["orders/paid"]
  uri = "/webhooks/orders-paid"

  [[webhooks.subscriptions]]
  topics = ["app/uninstalled"]
  uri = "/webhooks/app-uninstalled"

  # Mandatory privacy (GDPR) webhooks
  [[webhooks.subscriptions]]
  compliance_topics = ["customers/data_request", "customers/redact", "shop/redact"]
  uri = "/webhooks/compliance"

