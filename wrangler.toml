name = "w-system-e-invoice-shopify"
main = "src/index.js"
compatibility_date = "2026-10-01"

# Free tier only. Create the namespace once: wrangler kv namespace create STORE, then paste the id.
[[kv_namespaces]]
binding = "STORE"
id = "71dc204db06e4d578f799c28aec5f8b0"

[vars]
APP_URL = "https://wsystem.dev/shopify"
SHOPIFY_API_VERSION = "2026-07"
API_BASE = "https://api.wsystem.dev"
EMAIL_COPY_ENABLED = "0"
# Secrets (wrangler secret put): SHOPIFY_API_KEY, SHOPIFY_API_SECRET, ENC_KEY (32+ random chars), RESEND_API_KEY (only if EMAIL_COPY_ENABLED=1)
# Added with managed pricing / backups (deployed via the Cloudflare API; BACKUP_KEY, WSYSTEM_PROVISION_SECRET are secrets):
# vars: APP_HANDLE = "w-system-e-invoice"; kv BACKUP = 26ecdbc8007945878e6714ed80088ef3; cron "17 2 * * *"
